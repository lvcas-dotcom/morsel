# Morsel — Graph schema (spec 001, v0.1)
# Contrato de seleção; perfil de resultado, limites e desvios em protocol.md.
# Somente leitura. Sem Mutation, sem Subscription.

"""Limita o custo da bite. Substitui o orçamento padrão até o teto configurado."""
directive @budget(tokens: Int!) on QUERY

"""Campos de texto longos retornam uma forma curta (primeiras linhas + marcador de recuperação) em vez do conteúdo integral."""
directive @brief(lines: Int = 12) on FIELD

scalar Cursor

type Query {
  """Um arquivo pelo caminho relativo à raiz."""
  file(path: String!): File

  """Arquivos por glob (sintaxe doublestar). Ordem: caminho ascendente."""
  files(glob: String!, first: Int = 20, after: Cursor): FileConnection!

  """Símbolos pelo nome exato, ordenados por ID. `in` filtra por prefixo de pacote/diretório."""
  symbol(name: String!, in: String, kind: SymbolKind): [Symbol!]!

  """Busca de símbolos por prefixo/substring do nome. Substring case-sensitive. Ordem: ID ascendente."""
  symbols(query: String!, kind: SymbolKind, first: Int = 20, after: Cursor): SymbolConnection!

  """Resolve uma entidade pelo ID. Tokens de fragmento usam morsel_expand."""
  ref(id: ID!): Entity
}

interface Entity {
  id: ID!
  version: String!
  """Estimativa local do texto integral legível: arquivo ou declaração do símbolo; zero para binários."""
  tokens: Int!
}

type File implements Entity {
  id: ID!
  version: String!
  tokens: Int!
  path: String!
  language: String
  bytes: Int!
  lineCount: Int!
  generated: Boolean!
  binary: Boolean!
  """Conteúdo integral. Sujeito a orçamento; use `lines` ou `outline` quando possível."""
  content: String
  """Intervalo inclusivo de linhas, 1-indexado."""
  lines(from: Int!, to: Int!): String
  """Símbolos declarados no arquivo, sem corpos implícitos. Ordem: linha, depois ID. Lista limitada."""
  outline(kind: SymbolKind): [Symbol!]!
  """Imports Go, ordenados lexicalmente."""
  imports: [String!]!
}

type Symbol implements Entity {
  id: ID!
  version: String!
  tokens: Int!
  name: String!
  kind: SymbolKind!
  package: String!
  receiver: String
  file: File!
  line: Int!
  endLine: Int!
  exported: Boolean!
  signature: String!
  doc: String
  """Bytes da declaração completa, excluindo o comentário de documentação; não apenas o bloco de uma função."""
  body: String
  callers(first: Int = 20, after: Cursor): RelatedSymbols!
  callees(first: Int = 20, after: Cursor): RelatedSymbols!
}

type RelatedSymbols {
  """true quando a resolução é por nome (pode conter falsos positivos)."""
  approx: Boolean!
  total: Int!
  items: [Symbol!]!
  next: Cursor
}

enum SymbolKind {
  FUNC
  METHOD
  TYPE
  INTERFACE
  CONST
  VAR
}

type FileConnection {
  total: Int!
  items: [File!]!
  next: Cursor
}

type SymbolConnection {
  total: Int!
  items: [Symbol!]!
  next: Cursor
}
